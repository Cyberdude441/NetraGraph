name: NetraGraph CI/CD Quality & Security Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 1. Secret Leak & Repository Hygiene Audit
  # ============================================================
  secret-and-hygiene-audit:
    name: Secret Audit & Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Gitignore Protection for .env Files
        run: |
          echo "Checking .gitignore rules..."
          grep -E "^\.env$" .gitignore || (echo "ERROR: .env not found in .gitignore!" && exit 1)
          grep -E "^backend/\.env$" .gitignore || (echo "ERROR: backend/.env not found in .gitignore!" && exit 1)
          echo "Gitignore rules verified."

      - name: Scan Working Tree for Accidental Secrets
        run: |
          echo "Scanning repository files for sensitive credentials..."
          ! git ls-files | grep -E "(^\.env$|^backend/\.env$|\.pem$|\.key$|\.pfx$)" || (echo "ERROR: Secret files tracked in git!" && exit 1)
          echo "Repository working tree is clean of raw secret files."

  # ============================================================
  # 2. Backend Security & ML Integration Tests
  # ============================================================
  backend-test-suite:
    name: Backend Security, DB & ML Test Suite
    runs-on: ubuntu-latest
    needs: secret-and-hygiene-audit
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: netragraph_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_SYNC_URL: postgresql://postgres:postgres_ci_password@localhost:5432/netragraph_test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres_ci_password@localhost:5432/netragraph_test
      TESTING: "1"
      EMAIL_PROVIDER: "mock"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.12 Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio anyio

      - name: Restore Production ML Model Artifacts (Models A-E)
        run: |
          python scripts/build_models.py

      - name: Run Database Migrations (Alembic)
        run: |
          cd backend
          alembic upgrade head
          cd ..

      - name: Run Auth & Database Security Tests (33 tests)
        run: |
          python -m pytest backend/tests/test_auth_and_database.py -v

      - name: Run Phase 9 Deployment Security Tests (6 tests)
        run: |
          python -m pytest backend/tests/test_phase9_deployment_security.py -v

      - name: Run Phase 10 Container & Orchestration Tests
        run: |
          python -m pytest backend/tests/test_phase10_container_and_orchestration.py -v

      - name: Run Phase 11 Telemetry & Observability Tests (10 tests)
        run: |
          python -m pytest backend/tests/test_phase11_telemetry.py -v

      - name: Run System Regression Test Suite (14 tests)
        run: |
          python scripts/test_regression.py

      - name: Run ML Research & OOD Benchmark Tests
        run: |
          python -m pytest backend/tests/test_phase9_research_validation.py -v

  # ============================================================
  # 3. Frontend Static Compilation & Validation
  # ============================================================
  frontend-build-validation:
    name: Frontend TypeScript & Vite Production Build
    runs-on: ubuntu-latest
    needs: secret-and-hygiene-audit
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Compile Production Static Bundle
        working-directory: ./frontend
        run: npm run build

  # ============================================================
  # 4. Docker Build & Compose Validation
  # ============================================================
  docker-orchestration-validation:
    name: Docker Multi-Stage Build & Compose Lint
    runs-on: ubuntu-latest
    needs: [backend-test-suite, frontend-build-validation]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Backend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: netragraph-backend:ci-test

      - name: Validate Frontend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: netragraph-frontend:ci-test

      - name: Validate Docker Compose Configuration Syntax
        run: |
          docker compose -f docker-compose.yml config > /dev/null
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config > /dev/null
          echo "Docker Compose configurations are syntactically valid."
