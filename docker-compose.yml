version: '3.8'

# ============================================================
# NetraGraph Local / Development Full Stack Orchestration
# Services: PostgreSQL 16, Neo4j 5.x, Backend API, Frontend UI, Nginx
# ============================================================

networks:
  netragraph-net:
    driver: bridge
    name: netragraph-net

services:
  # 1. PostgreSQL 16 Relational & RBAC Database
  postgres:
    image: postgres:16-alpine
    container_name: netragraph-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-netragraph}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netragraph_dev_secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - netragraph-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-netragraph}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 2. Neo4j 5.x Knowledge Graph Database
  neo4j:
    image: neo4j:5.20.0-community
    container_name: netragraph-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-NetraGraphSecure2026!}
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 2G
      NEO4J_dbms_memory_pagecache_size: 512m
    ports:
      - "7474:7474" # HTTP Browser UI
      - "7687:7687" # Bolt Protocol Gateway
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    networks:
      - netragraph-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # 3. FastAPI Cyber Intelligence & Analysis Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: netragraph-backend
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:netragraph_dev_secret@postgres:5432/netragraph}
      - DATABASE_SYNC_URL=${DATABASE_SYNC_URL:-postgresql://postgres:netragraph_dev_secret@postgres:5432/netragraph}
      - NEO4J_URI=${NEO4J_URI:-bolt://neo4j:7687}
      - NEO4J_USER=${NEO4J_USER:-neo4j}
      - NEO4J_USERNAME=${NEO4J_USER:-neo4j}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-NetraGraphSecure2026!}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-netragraph-local-jwt-dev-secret-change-in-prod}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-30}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-mock}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-NetraGraph Security Division}
      - SMTP_USE_TLS=${SMTP_USE_TLS:-True}
      - COOKIE_SECURE=${COOKIE_SECURE:-False}
      - NVIDIA_NEMOTRON_API_KEY=${NVIDIA_NEMOTRON_API_KEY:-}
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY:-}
      - DEFAULT_AI_PROVIDER=${DEFAULT_AI_PROVIDER:-nemotron}
      - RUN_MIGRATIONS=true
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    volumes:
      - evidence_vault:/app/evidence_vault
    networks:
      - netragraph-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 4. React / Vite Analyst Workstation Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: netragraph-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - netragraph-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 5. Nginx Unified Gateway & Reverse Proxy
  nginx:
    image: nginx:1.27-alpine-slim
    container_name: netragraph-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - netragraph-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://localhost/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 6. Prometheus Real-Time Metrics Engine
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: netragraph-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - netragraph-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 7. Grafana Production Telemetry Dashboards
  grafana:
    image: grafana/grafana:10.4.1
    container_name: netragraph-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-NetraGraphAdmin2026!}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_HTTP_PORT=3000
    volumes:
      - ./docker/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - netragraph-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    name: netragraph_postgres_data
  neo4j_data:
    name: netragraph_neo4j_data
  neo4j_logs:
    name: netragraph_neo4j_logs
  neo4j_import:
    name: netragraph_neo4j_import
  evidence_vault:
    name: netragraph_evidence_vault
  prometheus_data:
    name: netragraph_prometheus_data
  grafana_data:
    name: netragraph_grafana_data
