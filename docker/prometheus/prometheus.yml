# ============================================================
# NetraGraph Prometheus Monitoring Configuration
# Scrapes backend metrics every 10 seconds
# ============================================================

global:
  scrape_interval: 10s
  evaluation_interval: 10s
  scrape_timeout: 5s

scrape_configs:
  - job_name: 'netragraph-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000']
        labels:
          application: 'netragraph'
          environment: 'production'
          tier: 'intelligence-api'
